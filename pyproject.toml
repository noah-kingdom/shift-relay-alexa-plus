[project]
name = "shift-relay"
version = "0.4.0"
description = "Trusted operational continuity agent for Alexa+ / MCP"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src"]
